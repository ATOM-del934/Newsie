<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>桌宠</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none}
  /* 鲸鱼在上、工具栏在下，两者贴紧 */
  #wrap{position:relative;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;padding:2px 0 4px}

  /* 鲸鱼本体：整块都是拖动区（原生拖窗，最顺滑）。无阴影。 */
  #whale{-webkit-app-region:drag;cursor:grab;
    width:104px;height:104px;display:block;object-fit:contain}
  #whale:active{cursor:grabbing}

  /* 工具栏：紧贴在鲸鱼下方，不参与拖动，可点击 */
  #bar{display:flex;gap:5px;margin-top:1px;-webkit-app-region:no-drag}
  .b{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;cursor:pointer;
    font-size:13px;line-height:1;color:#4a5568;background:#ffffff;
    border:1px solid #e4e9f1;box-shadow:0 1px 3px rgba(16,24,40,.16);transition:.15s}
  .b:hover{color:#131a2a;border-color:#0d9488;transform:translateY(-1px);
    box-shadow:0 2px 6px rgba(16,24,40,.22)}
  .b.hot{position:relative}
  .b.hot::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;
    background:#e11d48;box-shadow:0 0 0 2px #ffffff;display:none}
  .b.hot.on::after{display:block}

  /* 悬停提示：浮在顶部，不占布局、不影响间距 */
  #tip{position:absolute;left:50%;top:0;transform:translateX(-50%);
    font-size:10px;color:#8b95a8;white-space:nowrap;opacity:0;transition:.2s;pointer-events:none}
  body:hover #tip{opacity:1}
</style>
</head>
<body>
<div id="wrap">
  <img id="whale" alt="DeepSeek Harness 黑鲸" draggable="false">
  <div id="bar">
    <div class="b hot" id="btnMail" title="查看最新一期">📬</div>
    <div class="b" id="btnOpen" title="用浏览器打开最新一期">📄</div>
    <div class="b" id="btnMenu" title="菜单（也可右键托盘图标）">⋯</div>
  </div>
  <div id="tip">拖我换位置 · 📬 看最新一期</div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);

/* 头像由主进程推来（跟随「用透明底头像」设置） */
window.pet.onAvatar(url => { $('#whale').src = url; });

/* 未读红点 */
window.pet.onUnread(n => { $('#btnMail').classList.toggle('on', n > 0); });

$('#btnMail').addEventListener('click', () => window.pet.showBubble());
$('#btnOpen').addEventListener('click', () => window.pet.openLatest());
$('#btnMenu').addEventListener('click', () => window.pet.popupMenu());

/* 图片加载失败就藏起来（不至于变成破图） */
$('#whale').addEventListener('error', function () { this.style.visibility = 'hidden'; });
</script>
</body>
</html>
